name: release
on:
  push:
    branches: [main]
    paths: ["releases/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release for the newest releases/ folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$(ls -d releases/v*_* | sort -V | tail -1)
          test -f "$dir/RELEASE_NOTES.md"
          tag=$(basename "$dir" | cut -d_ -f1)
          grep -q "__version__ = \"${tag#v}\"" tangl_connector/__init__.py
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"; exit 0
          fi
          gh release create "$tag" "$dir"/*.zip "$dir"/*.pdf \
            --target "$GITHUB_SHA" \
            --title "Tangl Connector $tag" \
            --notes-file "$dir/RELEASE_NOTES.md" --latest
